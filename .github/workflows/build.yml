name: build and test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CXXFLAGS="-std=c++17 -Wall -Wextra -Werror -O2"
      - name: Test
        run: bash tests/run_tests.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Test
        shell: pwsh
        run: ./tests/run_tests.ps1
